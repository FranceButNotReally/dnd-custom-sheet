name: Rules Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Rules conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 157-case regression suite
        run: node --test tests/unit/*.test.mjs tests/rules/*.test.mjs tests/rules/157-regression.test.mjs

      - name: Run pinned-data contract tests
        run: npm run test:data

      - name: Generate coverage and corpus reports
        run: npm run test:coverage

      - name: Check application syntax
        run: node --check app.js && node --check sw.js
