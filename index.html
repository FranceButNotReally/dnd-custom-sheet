<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Offline-capable 2024 D&D character sheet backed by 5etools data.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>5etools Character Sheet</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">◆</div>
      <div>
        <div class="brand-title">5etools Character Sheet</div>
        <div class="brand-subtitle">2024 rules · offline capable</div>
      </div>
    </div>
    <div class="top-actions">
      <span id="networkBadge" class="status-pill">Checking…</span>
      <span id="dataBadge" class="status-pill">Data: …</span>
      <button id="updateBtn" class="button button-secondary">Update data</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab is-active" data-view="sheet">Character</button>
    <button class="tab" data-view="builder">Builder</button>
    <button class="tab" data-view="data">Data</button>
  </nav>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
