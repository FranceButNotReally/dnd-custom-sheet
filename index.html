<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302d27">
  <meta name="description" content="Offline-first 2024 D&D character sheet powered by cached 5etools data.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>5etools 2024 Character Sheet</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-text">
        <div class="brand-title">5etools Character Sheet</div>
        <div class="brand-subtitle">2024 rules · offline first · 5etools data · all official sources</div>
      </div>
    </div>
    <div class="top-actions">
      <span id="networkBadge" class="status-pill">Checking…</span>
      <span id="dataBadge" class="status-pill">5etools: not synced</span>
      <button id="installBtn" class="button button-small" hidden>Install</button>
      <button id="updateBtn" class="button button-small button-secondary">Update data</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab is-active" data-view="sheet">Character</button>
    <button class="tab" data-view="builder">Builder</button>
    <button class="tab" data-view="spells">Spells</button>
    <button class="tab" data-view="equipment">Equipment</button>
    <button class="tab" data-view="data">Data</button>
  </nav>

  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="referenceTooltip" class="reference-tooltip" hidden></div><div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <script src="./app.js?v=0272" type="module"></script>
</body>
</html>
